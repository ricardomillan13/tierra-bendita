<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-icon-76x76.png" />

    <!-- PWA -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0D0D0D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TB Ventas" />

    <title>Tierra Bendita Chocolate &amp; Coffee Shop</title>
    <meta name="description" content="Sistema de menú digital con punto de venta Tierra Bendita Chocolate & Coffee Shop" />
    <meta name="author" content="Tierra Bendita Chocolate & Coffee Shop" />

    <meta property="og:title" content="Tierra Bendita Chocolate & Coffee Shop" />
    <meta property="og:description" content="Sistema de menú digital con punto de venta" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.tierrabenditacafe.com" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .catch(err => console.warn('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
